name: shopbrasil-atividade01

x-airflow: &airflow
  image: apache/airflow:2.9.3-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Sao_Paulo
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@metadata/airflow
    AIRFLOW_CONN_SHOPBRASIL_ANALYTICS: postgres://shopbrasil:shopbrasil@analytics:5432/shopbrasil
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    init:
      condition: service_completed_successfully

services:
  metadata:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U airflow -d airflow"]
      interval: 3s
      timeout: 5s
      retries: 20

  analytics:
    image: postgres:16
    environment:
      POSTGRES_USER: shopbrasil
      POSTGRES_PASSWORD: shopbrasil
      POSTGRES_DB: shopbrasil
    volumes:
      - analytics-db:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-shopbrasil.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shopbrasil -d shopbrasil"]
      interval: 3s
      timeout: 5s
      retries: 20

  init:
    <<: *airflow
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    command: ["pools", "set", "ecommerce_pool", "2", "Cálculos por categoria"]
    depends_on:
      metadata:
        condition: service_healthy
      analytics:
        condition: service_healthy

  scheduler:
    <<: *airflow
    command: scheduler

  webserver:
    <<: *airflow
    command: webserver
    ports:
      - "127.0.0.1:${SHOPBRASIL_AIRFLOW_PORT:-8081}:8080"

volumes:
  airflow-db:
  analytics-db:
  airflow-logs:
