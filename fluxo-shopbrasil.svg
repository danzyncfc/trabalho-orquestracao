    <text x="198" y="91" font-size="16" font-weight="700">Apache Airflow</text>
    <text x="862" y="91" text-anchor="end" font-size="14" fill="#455d7c">Todos os dias às 06h de Brasília</text>
    <rect x="198" y="109" width="174" height="253" rx="12" fill="#edf4fd"/>
    <rect x="386" y="109" width="476" height="253" rx="12" fill="#edf4fd"/>
