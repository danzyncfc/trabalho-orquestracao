    </g>
    <g text-anchor="middle" font-size="14">
      <text x="85" y="188" font-weight="700">FakeStore API</text>
      <text x="286" y="188">Buscar produtos</text>
      <text x="286" y="281">Validar catálogo</text>
      <text x="468" y="225">Agrupar por<tspan x="468" dy="17">categoria</tspan></text>
      <text x="630" y="170">Calcular categoria 1</text>
      <text x="630" y="235">Calcular categoria 2</text>
      <text x="630" y="300">Calcular categoria N</text>
      <text x="790" y="225">Consolidar<tspan x="790" dy="17">e gravar</tspan></text>
