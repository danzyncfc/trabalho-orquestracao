<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="410" viewBox="0 0 1080 410" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline ShopBrasil</title>
  <desc id="desc">A DAG do Airflow busca e valida o catálogo, agrupa os produtos, calcula as métricas por categoria em até dois cálculos simultâneos e grava o retrato e o histórico no PostgreSQL.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#526784"/>
    </marker>
  </defs>
  <rect width="1080" height="410" rx="20" fill="#f5f8fc"/>
