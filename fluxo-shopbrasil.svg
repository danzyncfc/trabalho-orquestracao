      <path d="M529 230H565"/>
      <path d="M529 230H545V295H565"/>
      <path d="M695 165H716V230H735"/>
      <path d="M695 230H735"/>
      <path d="M695 295H716V230H735"/>
      <path d="M845 230H905"/>
    </g>

    <g fill="#fff" stroke="#98afd0" stroke-width="1.2">
      <rect x="21" y="158" width="129" height="50" rx="9"/>
      <rect x="216" y="160" width="139" height="46" rx="8"/>
      <rect x="216" y="252" width="139" height="48" rx="8"/>
      <rect x="407" y="205" width="122" height="50" rx="8"/>
      <rect x="565" y="144" width="130" height="42" rx="8"/>
